# actions/setup-go with a cached toolchain. On Linux and hosted Windows the
# toolchain is restored where setup-go's exact-version lookup finds it, so
# setup-go logs 'Found in cache', and a push that missed saves it after
# setup-go installs it. On hosted Windows setup-go writes the files to the
# same path on D: (C: is far slower to write) and links the C: tool cache path
# to them, so the D: copy is what is cached and a restore recreates the links.
# Other runners only run setup-go.
name: Set up Go
description: >-
  Runs actions/setup-go for go-version-file with cache false, restoring and
  saving the toolchain it installs on Linux and hosted Windows.

inputs:
  go-version-file:
    description: >-
      The go.mod setup-go reads, relative to the workspace root. As in setup-go,
      a toolchain line wins over the go line unless GOTOOLCHAIN is 'local'. A
      version other than x.y.z skips the restore and the save.
    required: true

runs:
  using: composite
  steps:
    # Later steps gate on this step's outputs, which are empty when it skips.
    - id: env
      if: runner.os == 'Linux' || runner.os == 'Windows'
      shell: bash
      env:
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
      run: |
        set -euo pipefail
        file="$GITHUB_WORKSPACE/$GO_VERSION_FILE"
        v=''
        if [ -f "$file" ]; then
          if [ "${GOTOOLCHAIN:-}" != local ]; then
            v="$(grep -m1 -oE '^toolchain go1\.[0-9]+(\.[0-9]+|rc[0-9]+)?' "$file" || true)"
            v="${v#toolchain go}"
          fi
          if [ -z "$v" ]; then
            v="$(grep -m1 -oE '^go [0-9]+(\.[0-9]+)*' "$file" || true)"
            v="${v#go }"
          fi
        fi
        # setup-go names the arch directory after node's os.arch().
        case "$RUNNER_ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) arch='' ;;
        esac
        if [ -z "$arch" ] || [ -z "${RUNNER_TOOL_CACHE:-}" ] \
          || ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "go-toolchain: no x.y.z version in $GO_VERSION_FILE ('$v') for $RUNNER_ARCH; skipping the toolchain cache"
          echo "valid=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        dir="$RUNNER_TOOL_CACHE/go/$v"
        files="$dir"
        link=''
        if [ "$RUNNER_OS" = Windows ]; then
          dir="${dir//\\//}"
          # setup-go's own test for when it installs to D: (cacheWindowsDir).
          if { [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ] && [ "${AGENT_ISSELFHOSTED-1}" = 1 ]; } \
            || [[ "$dir" != [Cc]:/* ]] || ! [ -d C:/ ] || ! [ -d D:/ ]; then
            echo "go-toolchain: setup-go does not install to D: on this runner; skipping the toolchain cache"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="D:${dir:2}"
          link="$dir/$arch"
        fi
        # A copy the runner image ships is used as is: no restore, no save.
        present=false
        if [ -e "$dir" ]; then
          present=true
        fi
        push=false
        # TRIAL ONLY: PR runs save too, so later attempts of the scratch PR hit.
        if [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          push=true
        fi
        {
          echo "valid=true"
          echo "version=$v"
          echo "arch=$arch"
          echo "path=$files"
          echo "link=$link"
          echo "present=$present"
          echo "push=$push"
          echo "key=go-toolchain-${RUNNER_OS}-${RUNNER_ARCH}-${v}"
        } >> "$GITHUB_OUTPUT"

    - id: restore
      if: steps.env.outputs.valid == 'true' && steps.env.outputs.present != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.env.outputs.path }}
        key: ${{ steps.env.outputs.key }}

    # A restore that fails partway warns and reports no hit, leaving a partial
    # tree; a hit must run as go<v>. Either is removed so setup-go downloads.
    # On Windows, tc.find looks only under C: and checks only that the marker
    # exists, so a good hit gets the junction and marker setup-go would make.
    - if: steps.env.outputs.valid == 'true'
      shell: bash
      env:
        DIR: ${{ steps.env.outputs.path }}
        ARCH_DIR: ${{ steps.env.outputs.arch }}
        VERSION: ${{ steps.env.outputs.version }}
        PRESENT: ${{ steps.env.outputs.present }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
        LINK: ${{ steps.env.outputs.link }}
      run: |
        set -euo pipefail
        [ -e "$DIR" ] || exit 0
        if [ "$HIT" != true ]; then
          [ "$PRESENT" != true ] || exit 0
          echo "::warning::go-toolchain: a failed restore left $DIR; removing it"
        else
          go="$DIR/$ARCH_DIR/bin/go"
          [ "$RUNNER_OS" != Windows ] || go="$go.exe"
          out="$(GOTOOLCHAIN=local "$go" version 2>/dev/null || true)"
          case "$out" in
            "go version go$VERSION "*)
              if [ -n "$LINK" ]; then
                mkdir -p "${LINK%/*}"
                MSYS_NO_PATHCONV=1 cmd /c mklink /J "${LINK//\//\\}" "${DIR//\//\\}\\$ARCH_DIR"
                : > "$LINK.complete"
              fi
              exit 0 ;;
          esac
          echo "::warning::go-toolchain: the restored $DIR does not run as go$VERSION; removing it"
        fi
        rm -rf "$DIR"

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - if: >-
        steps.env.outputs.push == 'true' && steps.env.outputs.present == 'false'
        && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.env.outputs.path }}
        key: ${{ steps.env.outputs.key }}
