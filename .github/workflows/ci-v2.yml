name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — weekly vuln re-scan of main

# One live run per pull request: a newer run for the same PR cancels the older
# one, whether it carries a new head or is a same-SHA twin (a stack push that
# moves a PR's base and head together fires two pull_request runs). The
# cancelled run's ci-ok still runs (always()) and fails at once; the live run's
# ci-ok lands minutes later and supersedes it. Push and schedule runs key on
# run_id, so each commit on main keeps its own full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Each job's timeout-minutes is at least 2.5x its longest run, failures
# included, so it cancels only a hang, which would otherwise hold a runner for
# GitHub's 360-minute default. A timed-out need fails ci-ok.
jobs:
  # ============================================================================
  # Job 1: Detect which components changed
  # ============================================================================
  changes:
    permissions:
      contents: read
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      # yamllint: valid GitHub Actions context expression
      framework: ${{ steps.filter.outputs.framework }}
      # yamllint: valid GitHub Actions context expression
      migrate_tool: ${{ steps.filter.outputs.migrate_tool }}
      # `code` = any non-doc change that must run the full coverage + SonarCloud
      # path. It is its OWN explicit filter (see `code:` under `filters:` below),
      # NOT inferred from framework/migrate_tool: those two omit non-Go scan
      # inputs (e.g. sonar-project.properties), so deriving `code` from them
      # would skip the scan on a Sonar-config-only change. The coverage run
      # (framework-test, framework-integration-test, migrate-tool-test,
      # SonarCloud) gates on this; doc-only PRs match nothing and skip it.
      # yamllint: valid GitHub Actions context expression
      code: ${{ steps.filter.outputs.code }}
      # `docs` = any Markdown change, plus the two files that decide how Markdown
      # is linted (the markdownlint config and the Makefile holding the pinned
      # linter version). It is the deliberate COMPLEMENT of the three filters
      # above — they ignore prose on purpose, so without this a doc-only PR would
      # run no job at all. Only lint-docs gates on it; it must never gate a Go job.
      # yamllint: valid GitHub Actions context expression
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # paths-filter reads a PR's changed files from the GitHub API; only push
      # runs diff with git and need the checkout.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # The framework/migrate_tool/code filters intentionally match only
          # code-affecting paths. Doc-only changes (`wiki/**`, `CLAUDE.md`,
          # `README.md`, `MULTI_TENANT.md`, `llms.txt`, etc.) match none of them,
          # so the test/build/lint/security jobs gated on those outputs cleanly
          # skip — keeping doc PRs fast. `docs` is their complement: it matches
          # exactly the Markdown those three ignore, so a doc-only PR still runs
          # the (cheap) markdownlint job rather than running nothing at all.
          # CI workflow changes still trigger every component so reviewers see
          # the consequences of pipeline edits.
          #
          # NOTE: do not add `!tools/**` (or any other `!pattern`) here. Under
          # dorny/paths-filter's default `predicate-quantifier: some`, a `!`
          # entry is OR'd as its own positive predicate matching every file
          # outside the inner glob — it does NOT subtract from the list. Adding
          # `!tools/**` would make the filter true for every non-tools file
          # (including all of `wiki/**`), defeating the doc-only skip. The
          # `**/*.go` pattern below already matches `tools/**/*.go`, so tool
          # Go-file changes correctly re-run the framework matrix without help
          # from a negation.
          #
          # COVERAGE COMPLETENESS — these two filters scope the per-module
          # lint/build/security jobs, but they must NOT gate the coverage
          # run independently. SonarCloud analyzes the framework and the migrate
          # tool as a single project fed by one merged coverage.out, assembled
          # from the framework-test, framework-integration-test, and
          # migrate-tool-test jobs. If the coverage run were gated per-module, a
          # change touching only one module would upload a report missing the
          # other module's coverage, and SonarCloud would score that module as
          # 0% covered — e.g. a renovate bump to `tools/migration/go.mod`
          # (framework filter false) collapsed framework coverage from ~90% to
          # ~4% and reddened the gate. To prevent that, the coverage run gates on
          # the explicit `code` filter below — NOT on framework/migrate_tool —
          # so it always runs all three coverage jobs together and uploads a
          # complete report; doc-only PRs match nothing and still skip it.
          #
          # `code` is defined explicitly (not inferred as framework||migrate_tool)
          # because that union omits non-Go scan inputs — most importantly
          # sonar-project.properties (a Sonar-config-only PR would otherwise set
          # code=false and skip the scan). It is the UNION of every real non-doc
          # path in framework + migrate_tool — note the tools/migration manifests
          # must be listed here too, since framework's root-anchored go.mod/go.sum/
          # Makefile do NOT match the nested tools/migration copies — PLUS
          # sonar-project.properties and the go.work/go.work.sum workspace files.
          # Keep it free of `!` negations (see the NOTE above) so docs still skip.
          #
          # `**/testdata/**` is listed in framework/migrate_tool/code alike: any
          # file a test reads is a code input, so a golden-fixture-only PR must
          # still run the tests, coverage, Sonar, and apidiff checks it feeds.
          filters: |
            framework:
              - '**/*.go'
              # The guard scans .s too, so an assembly-only change must reach the
              # jobs that run it — same reasoning as '**/*.go' above (#1757).
              - '**/*.s'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/ci-v2.yml'
              # The go-cache and go-toolchain composites the Go jobs call.
              - '.github/actions/**'
              # scripts/ holds the build-tag guard and the race package query the
              # lint and security jobs run (#1757). Without this entry, editing
              # them alone would skip the very jobs that execute them.
              - 'scripts/**'
              - '**/testdata/**'
            migrate_tool:
              - 'tools/migration/**/*.go'
              - 'tools/migration/**/*.s'
              - 'tools/migration/go.mod'
              - 'tools/migration/go.sum'
              - 'tools/migration/Makefile'
              - '.github/workflows/ci-v2.yml'
              - '.github/actions/**'
              # This module's lint-race and sec run ../../scripts/check-build-tags.sh,
              # so the same entry the framework filter carries is needed here too.
              - 'scripts/**'
              - 'tools/migration/**/testdata/**'
            code:
              - '**/*.go'
              # Assembly is compiled code, so the test, coverage and Sonar jobs
              # that gate on `code` must see an .s-only change (#1757).
              - '**/*.s'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'Makefile'
              - '.golangci.yml'
              - 'sonar-project.properties'
              - '.github/workflows/ci-v2.yml'
              - '.github/actions/**'
              # The coverage producers and SonarCloud's merge run it, so an awk-only
              # change must reach the coverage and Sonar jobs that gate on `code`.
              - 'scripts/cover-dedup.awk'
              - 'tools/migration/go.mod'
              - 'tools/migration/go.sum'
              - 'tools/migration/Makefile'
              - '**/testdata/**'
            docs:
              # Markdown only — `llms.txt` and the other non-Markdown prose files
              # are not linted. The single `**/*.md` entry is exactly as wide as
              # the linter's own glob: a picomatch globstar spans zero directories
              # so `README.md` matches without a second `*.md` entry, and
              # paths-filter compiles with `dot: true` so `.claude/**/*.md` (which
              # markdownlint DOES lint) matches too. Keep those two properties in
              # mind before "clarifying" this into several narrower globs — a
              # filter narrower than the linter lets a violation merge unlinted
              # and then fail an unrelated PR later.
              # The last two entries are inputs, not outputs:
              # `.markdownlint-cli2.jsonc` owns the rule set AND the glob/ignore
              # list, and the Makefile owns the pinned MARKDOWNLINT_VERSION that
              # `make lint-md` runs — a Renovate bump of that pin touches no
              # Markdown, so without `Makefile` here the new linter version would
              # merge without ever having linted the tree. Still no `!` negations
              # (see the NOTE above) — one would make this filter true for every
              # Go-only change and run the doc lint on every PR.
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - 'Makefile'
              # lint-docs runs the ci-ok needs-completeness guard, so this entry
              # is what runs that guard on every edit of this workflow.
              - '.github/workflows/ci-v2.yml'

  # ============================================================================
  # Framework CI Jobs (conditional on framework changes)
  # ============================================================================

  framework-test:
    permissions:
      contents: read
    needs: changes
    # Gates on `code` (not `framework`) so framework coverage is regenerated on
    # ANY non-doc change — including tools/migration-only bumps — keeping the
    # merged SonarCloud report complete. See the `code` filter rationale.
    if: needs.changes.outputs.code == 'true'
    # The Windows leg is framework-test-windows below. This one-entry matrix
    # keeps the check name framework-test (ubuntu-latest).
    strategy:
      matrix:
        os: [ubuntu-latest]
    # Pinned ahead of ubuntu-latest's move to 26.04: the Go cache keys by
    # runner image, so jobs alternating images miss it. matrix.os stays
    # ubuntu-latest to keep the check names (and migrate-tool-build's guards).
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # framework-test-windows aliases the three anchored steps, so an edit to
    # one of them here changes both jobs (GitHub has no `<<:` merge keys).
    # Every other job's Download dependencies aliases *go-mod-download or its run text.
    steps:
      - &fw-checkout
        uses: actions/checkout@v7

      - &fw-setup-go
        name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: go.mod

      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: fw-test
          writer: 'true'

      # Only the proxy fetch is retried: a go.sum mismatch fails every attempt
      # alike. bash, not the Windows default, so the Windows aliases run it too.
      - &go-mod-download
        name: Download dependencies
        shell: bash
        run: &go-mod-download-retry |
          for delay in 15 30; do
            go mod download && exit 0
            echo "::warning title=network retry::go mod download failed; retrying in ${delay}s"
            sleep "$delay"
          done
          go mod download

      # Compile only, with the test step's build flags, so the save stores no
      # test result or vet verdict (the writer rule in .github/actions/go-cache).
      - name: Warm the build cache (compile only)
        if: steps.gocache.outputs.save == 'true'
        run: go test -c -vet=off -race -cover -covermode=atomic -coverpkg=./... -o /dev/null ./...

      - name: Save Go cache
        if: steps.gocache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.primary-key }}

      - name: Run tests (Unix)
        run: |
          set -euo pipefail
          # Test all packages - tools/* are separate modules, excluded automatically
          go test -race -cover -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          # -coverpkg writes every block once per test binary; collapse the copies.
          # Plain commands, not an && chain, so errexit sees awk's exit status.
          awk -f scripts/cover-dedup.awk coverage.out > coverage.out.dedup
          # The deduped profile must give go test's own -func report and block set
          # (the block set catches a change -func's 0.1% rounding hides).
          go tool cover -func=coverage.out > cover-func-raw.txt
          go tool cover -func=coverage.out.dedup > cover-func-dedup.txt
          if ! cmp -s cover-func-raw.txt cover-func-dedup.txt; then
            echo "::error::cover-dedup.awk changed the go tool cover -func report"
            diff cover-func-raw.txt cover-func-dedup.txt | head -n 20 || true
            exit 1
          fi
          sed '1d; s/ [0-9][0-9]*$//' coverage.out | LC_ALL=C sort -u > cover-blocks-raw.txt
          sed '1d; s/ [0-9][0-9]*$//' coverage.out.dedup | LC_ALL=C sort > cover-blocks-dedup.txt
          if ! cmp -s cover-blocks-raw.txt cover-blocks-dedup.txt; then
            echo "::error::cover-dedup.awk changed the set of coverage blocks"
            diff cover-blocks-raw.txt cover-blocks-dedup.txt | head -n 20 || true
            exit 1
          fi
          mv coverage.out.dedup coverage.out

      - name: Enforce ADR-026 allocation guards (no -race)
        run: |
          set -euo pipefail
          # The race detector inflates testing.AllocsPerRun counts, so these guards skip
          # under -race (internal/racedetect). Run them without -race so the
          # ADR-026 zero-overhead invariant (the typed-path allocs/op ceiling, the
          # echo-native default chain, and every other AllocsStable guard in the tree) is
          # actually enforced on PRs, not silently skipped. Delegates to the
          # `make test-alloc` target so the command lives in exactly one place.
          make test-alloc

      - name: Upload unit test coverage artifact (Ubuntu only)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.out
          retention-days: 7
          overwrite: true

  # framework-test's Windows leg, split out so sonarcloud does not wait on a
  # leg that uploads no coverage.
  framework-test-windows:
    permissions:
      contents: read
    name: framework-test
    needs: changes
    # The tests gate on `code`, the build on `framework` (which alone lists all
    # of scripts/**) or a saving run, so the job runs on either filter.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.framework == 'true'
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - *fw-checkout

      # Restoring a Go cache to the work disk (D:) extracts ~4x faster than to
      # C: (A/B run 37020331979). The migrate-tool Windows legs alias this
      # step: the cache version hashes the literal paths, so keep one text.
      - &go-caches-work-disk
        name: Put Go caches on the work disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          if ($d -ne 'C:') { "GOCACHE=$d\go-build" >> $env:GITHUB_ENV; "GOMODCACHE=$d\go-mod" >> $env:GITHUB_ENV }

      - *fw-setup-go

      # This job writes fw-build's Windows entry.
      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: fw-build
          writer: 'true'

      - *go-mod-download

      # framework-build's Windows leg, overlapping the tests. It gates in its
      # body, not with if: (a wait on a skipped background step is
      # undocumented), and always builds on a saving run (push with an
      # exact-key miss) so the saved entry holds the plain build output. Wait
      # steps take no timeout, so timeout-minutes bounds a hung build.
      - name: Build (Windows)
        id: winbuild
        background: true
        timeout-minutes: 10
        shell: pwsh
        env:
          FW: ${{ needs.changes.outputs.framework }}
          SAVE: ${{ steps.gocache.outputs.save }}
        run: |
          if ($env:FW -ne 'true' -and $env:SAVE -ne 'true') { exit 0 }
          $packages = go list ./... | Where-Object { $_ -notmatch '/tools(/|$)' }
          if (-not $packages) {
            Write-Host "No packages found to build"
            exit 1
          }
          go build -v $packages

      - name: Run tests (Windows)
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
        env:
          # A saving run saves the job's GOCACHE after the wait below, so its
          # race build goes elsewhere and the entry keeps winbuild's plain build
          # output, with no test result or vet verdict. Otherwise env.GOCACHE
          # keeps the job's cache: the work disk, or '' (Go's default) when the
          # work-disk step set none. A bare '' would put it back on C:.
          GOCACHE: ${{ steps.gocache.outputs.save == 'true' && format('{0}\go-build-race', runner.temp) || env.GOCACHE }}
        run: |
          $packages = go list ./... | Where-Object { $_ -notmatch '/tools(/|$)' }
          if (-not $packages) {
            Write-Host "No packages found to test"
            exit 1
          }

          $testOutput = go test -race $packages 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Host $testOutput
            exit 0
          }

          Write-Host "Initial test run failed, re-running per package to evaluate failures" -ForegroundColor Yellow
          $knownPatterns = @(
            'Expected /tmp.*got D:'
          )
          $unexpectedFailure = $false

          foreach ($pkg in $packages) {
            Write-Host "Re-testing package: $pkg" -ForegroundColor Cyan
            $pkgOutput = go test -race $pkg 2>&1
            $pkgExitCode = $LASTEXITCODE

            if ($pkgExitCode -eq 0) {
              Write-Host $pkgOutput
              continue
            }

            $isKnownIssue = $false
            foreach ($pattern in $knownPatterns) {
              if ($pkgOutput -match $pattern) {
                Write-Host "Known Windows-specific issue detected in ${pkg}: $pattern" -ForegroundColor Yellow
                $isKnownIssue = $true
                break
              }
            }

            if (-not $isKnownIssue) {
              Write-Host "Unexpected test failure in $pkg" -ForegroundColor Red
              Write-Host $pkgOutput
              $unexpectedFailure = $true
            } else {
              Write-Host $pkgOutput
            }
          }

          if ($unexpectedFailure) {
            exit 1
          }

          Write-Host "All unexpected Windows test failures resolved or matched known issues." -ForegroundColor Green
          exit 0

      # Joins winbuild; its failure fails the job here. Wait steps always run
      # and reject if:.
      - name: Wait for Windows build
        wait: winbuild

      - name: Save Go cache
        if: steps.gocache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.primary-key }}

  framework-integration-test:
    permissions:
      contents: read
    needs: changes
    # Gates on `code` so integration coverage is part of every merged report.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # Provides the real Flyway binary the integration test runs against; the
      # migration/testdata/flyway files are captured JSON-output samples used by
      # the parser unit tests. Flyway 12.x and later ship only from Redgate's own
      # distribution server (Maven Central stopped publishing the self-contained
      # platform CLI tarballs mid-11.x; see the Install step).
      # renovate: datasource=github-releases depName=flyway/flyway
      FLYWAY_VERSION: 13.9.0
      FLYWAY_SHA256: d5ce62f75a8b40d1d74427f72d86af6708d957894ebfd86b349d67f6df8a18a5
      TESTCONTAINERS_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # Every test binary shares the reaper above, and Ryuk exits 10s after its
      # last client disconnects. `go test` starts packages in command-line order,
      # up to -p at a time; the internal/*, jose, keystore and logger packages
      # queued between the database/inbox group and messaging filled the slots
      # for ~9-10s, so messaging reused a reaper that was already exiting
      # ("wait for reaper <id>: context deadline exceeded", or a handshake EOF
      # followed by "RWLayer of container <id> is unexpectedly nil" when Ryuk's
      # exit prune deleted the fresh container). 2m outlives any inter-package
      # gap.
      RYUK_RECONNECTION_TIMEOUT: 2m

    steps:
      - uses: actions/checkout@v7

      # Pulls overlap the setup steps below; the wait step before the tests
      # joins them. Fail-closed (#993) now rests on that wait failing when this
      # step fails, so never add continue-on-error here. Wait steps have no
      # timeout, so timeout-minutes bounds a hung pull (observed pulls finish
      # in under 30s).
      - name: Pre-pull container images
        id: prepull
        background: true
        timeout-minutes: 10
        run: |
          echo "Warming Docker cache with container images..."
          pids=""
          # renovate: datasource=docker depName=postgres
          docker pull postgres:18.6-alpine &
          pids="$pids $!"
          # renovate: datasource=docker depName=gvenzl/oracle-free
          docker pull gvenzl/oracle-free:23.26.3-slim &
          pids="$pids $!"
          # renovate: datasource=docker depName=rabbitmq
          docker pull rabbitmq:4.3.6-management-alpine &
          pids="$pids $!"
          # renovate: datasource=docker depName=redis
          docker pull redis:8.10.2-alpine &
          pids="$pids $!"
          rc=0
          for pid in $pids; do
            wait "$pid" || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo "One or more image pulls failed" >&2
            exit 1
          fi
          echo "All container images cached"

      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: go.mod

      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: fw-integ
          writer: 'true'

      - *go-mod-download

      # Compile only, so the save stores no test result or vet verdict (the
      # writer rule in .github/actions/go-cache).
      - name: Warm the build cache (compile only)
        if: steps.gocache.outputs.save == 'true'
        run: go test -c -vet=off -race -tags=integration -covermode=atomic -coverpkg=./... -o /dev/null ./migration ./...

      - name: Save Go cache
        if: steps.gocache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.primary-key }}

      - name: Restore Flyway CLI
        id: cache-flyway
        # The SHA256 is part of the cache key so a version/digest bump
        # invalidates the cached tarball automatically.
        uses: actions/cache/restore@v6
        with:
          path: /tmp/flyway-${{ env.FLYWAY_VERSION }}
          key: flyway-${{ env.FLYWAY_VERSION }}-${{ env.FLYWAY_SHA256 }}

      - name: Install Flyway CLI
        if: steps.cache-flyway.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Flyway 12.x and later are distributed only from Redgate's server —
          # Maven Central stopped publishing the self-contained -linux-x64.tar.gz
          # mid-11.x (last one is 11.8.2). The SHA256 check below keeps this host
          # integrity-pinned.
          url="https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "$url" -o /tmp/flyway.tar.gz
          actual="$(sha256sum /tmp/flyway.tar.gz | awk '{print $1}')"
          if [ "$actual" != "$FLYWAY_SHA256" ]; then
            echo "Flyway tarball checksum mismatch:"
            echo "  expected: $FLYWAY_SHA256"
            echo "  actual:   $actual"
            echo "If the bump is intentional, update FLYWAY_SHA256 in this workflow."
            exit 1
          fi
          tar -xzf /tmp/flyway.tar.gz -C /tmp

      # Only push runs save, so pull requests never store a copy of their own.
      - name: Save Flyway CLI
        if: github.event_name == 'push' && steps.cache-flyway.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/flyway-${{ env.FLYWAY_VERSION }}
          key: ${{ steps.cache-flyway.outputs.cache-primary-key }}

      - name: Wire Flyway onto PATH
        run: |
          sudo ln -sf "/tmp/flyway-${FLYWAY_VERSION}/flyway" /usr/local/bin/flyway
          flyway --version | head -3

      - name: Wait for container image pre-pull
        wait: prepull

      - name: Run integration tests
        run: |
          set -euo pipefail
          docker info >/dev/null 2>&1 || { echo "Docker is not running"; exit 1; }
          echo "Running integration tests with testcontainers..."
          # ./migration, the slowest package, is listed first so it starts first;
          # go test drops the duplicate ./... match. The guard fails the job if
          # the list ever matches a different package set than ./... alone; -e
          # leaves package load errors to go test's per-package report.
          pkgs=(./migration ./...)
          want="$(go list -e -tags=integration ./... | sort -u)"
          got="$(go list -e -tags=integration "${pkgs[@]}" | sort -u)"
          if [ "$got" != "$want" ]; then
            echo "::error::integration packages (${pkgs[*]}) differ from ./..."
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
            exit 1
          fi
          # Build tag controls which tests run - only integration tests will execute.
          # -timeout 15m is an interim safeguard for the ADR-020 rollout window;
          # revert (or hold at 15m) once schema-per-test proves stable across
          # 20 consecutive green runs (issue #404).
          go test -race -parallel 2 -timeout 15m -tags=integration -covermode=atomic -coverpkg=./... -coverprofile=coverage-integration.out "${pkgs[@]}"
          # Collapse the per-test-binary block copies and check the result against
          # go test's own profile, as framework-test does.
          awk -f scripts/cover-dedup.awk coverage-integration.out > coverage-integration.out.dedup
          go tool cover -func=coverage-integration.out > cover-func-raw.txt
          go tool cover -func=coverage-integration.out.dedup > cover-func-dedup.txt
          if ! cmp -s cover-func-raw.txt cover-func-dedup.txt; then
            echo "::error::cover-dedup.awk changed the go tool cover -func report"
            diff cover-func-raw.txt cover-func-dedup.txt | head -n 20 || true
            exit 1
          fi
          sed '1d; s/ [0-9][0-9]*$//' coverage-integration.out | LC_ALL=C sort -u > cover-blocks-raw.txt
          sed '1d; s/ [0-9][0-9]*$//' coverage-integration.out.dedup | LC_ALL=C sort > cover-blocks-dedup.txt
          if ! cmp -s cover-blocks-raw.txt cover-blocks-dedup.txt; then
            echo "::error::cover-dedup.awk changed the set of coverage blocks"
            diff cover-blocks-raw.txt cover-blocks-dedup.txt | head -n 20 || true
            exit 1
          fi
          mv coverage-integration.out.dedup coverage-integration.out

      - name: Upload integration test coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.out
          retention-days: 7
          overwrite: true

  framework-build:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    # The Windows build runs in framework-test-windows. This one-entry matrix
    # keeps the check name framework-build (ubuntu-latest). The job also runs
    # govulncheck and, on PRs, the apidiff gate.
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          # apidiff needs full history and tags on PRs.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: go.mod

      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: fw-build
          writer: 'true'

      - *go-mod-download

      - name: Build (Unix)
        id: build
        run: |
          set -euo pipefail
          packages=$(go list ./... | grep -vE '/tools(/|$)')
          if [ -n "$packages" ]; then
            go build -v $packages
          else
            echo "No packages found to build"
            exit 1
          fi

      # !cancelled() lets each check still report when an earlier step fails.
      - name: Run govulncheck (framework)
        if: ${{ !cancelled() }}
        run: make vuln

      # Saved after vuln, whatever its verdict, so govulncheck's build output is
      # in the entry. No step after this point reaches the saved entry.
      - name: Save Go cache
        if: ${{ !cancelled() && steps.gocache.outputs.save == 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.primary-key }}

      # Exported-API compatibility gate (apidiff — delta over the PR's base branch)
      # Diffs the PR head's exported API surface (root module only — internal/
      # is auto-ignored by apidiff and GOWORK=off excludes the
      # separately-versioned tools/migration submodule) against the latest
      # release tag, then SUBTRACTS the incompatible changes the PR's BASE
      # BRANCH already carries — origin/main for an ordinary PR, the link below
      # for a stacked one. The gate fails only on the DELTA — breaks THIS PR
      # introduces — not acknowledged-but-unreleased breaks already merged to
      # main (those would otherwise false-fail every later PR until the next
      # release). FAILS on a NEW INCOMPATIBLE change UNLESS the squash PR title
      # carries a conventional-commit '!' marker (feat!:/fix(scope)!: …) or the
      # PR has the 'breaking-approved' label. This catches ACCIDENTAL breaks
      # that would otherwise ship as a patch/minor — release-please derives the
      # bump from the squash PR title, so the same '!' that bypasses the gate
      # also drives the version bump (no drift). The tag stays the baseline so
      # the cumulative report still measures drift since the last GA release.
      #
      # Runs on pull_request ONLY: the escape hatch reads the PR title, which
      # exists only in PR context. On push to main (post-merge) the break is
      # already accepted, so these steps skip there. !cancelled() drops the
      # implicit success(), so each step names the outcomes it depends on.
      - name: Install apidiff
        id: apidiff_install
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # Pinned for reproducibility (x/exp ships only pseudo-versions). The
        # annotation lets Renovate bump this 'go install …@version' literal,
        # which its gomod manager cannot see (see renovate.json customManagers).
        # renovate: datasource=go depName=golang.org/x/exp
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba

      - name: Resolve latest release tag (baseline)
        id: baseline
        if: ${{ !cancelled() && steps.apidiff_install.outcome == 'success' }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          # GA tags only (vX.Y.Z) — exclude pre-releases (vX.Y.Z-rc1) so the
          # baseline is always the latest stable release. `|| true` keeps the
          # no-tag case on the skip path below rather than aborting on pipefail.
          base_tag="$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$base_tag" ]; then
            echo "::warning::No GA release tag found; skipping API-compatibility check (no baseline to diff against)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Baseline release tag: $base_tag"
          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"

      - name: Build baseline API snapshot (at latest tag)
        id: snapshot_tag
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' && steps.baseline.outputs.skip != 'true' }}
        env:
          BASE_TAG: ${{ steps.baseline.outputs.base_tag }}
          # GOWORK=off restricts the diff to the ROOT module's packages and
          # excludes the separately-versioned tools/migration submodule (only
          # unioned in via go.work). internal/ is auto-ignored by apidiff.
          GOWORK: "off"
        run: |
          set -euo pipefail
          # Defensive pre-clean: a prior cancelled run on a reused (self-hosted)
          # runner could leave the path behind, which would fail `worktree add`.
          git worktree remove --force /tmp/apidiff-base 2>/dev/null || true
          rm -rf /tmp/apidiff-base
          git worktree add --detach /tmp/apidiff-base "$BASE_TAG"
          ( cd /tmp/apidiff-base \
            && GOWORK=off apidiff -m -w /tmp/apidiff-base.snapshot github.com/gaborage/go-bricks )

      - name: Build base-branch API snapshot (unreleased baseline)
        id: snapshot_base
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' && steps.baseline.outputs.skip != 'true' }}
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          # The checkout is refs/pull/N/merge: the PR merged into its base's tip at
          # run start. Its FIRST PARENT is therefore exactly the base the head
          # snapshot was merged into — main, or the link below in a stack — frozen
          # for the run, so a base that moves meanwhile cannot skew the
          # subtraction. The event's pull_request.base.sha is NOT that commit: it
          # is the PR's merge-base, refreshed only on rebase, so for a branch that
          # predates a merged break it lags and every break merged since lands in
          # the delta as if this PR made it (#1233).
          # Without a second parent HEAD^1 would be the PR head's own parent: refuse.
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "::error::apidiff expects the refs/pull/N/merge checkout (a merge commit); HEAD has no second parent"
            exit 1
          fi
          base_sha="$(git rev-parse HEAD^1)"
          echo "base snapshot at first parent of the merge ref: $base_sha"
          # Defensive pre-clean, matching the baseline step.
          git worktree remove --force /tmp/apidiff-main 2>/dev/null || true
          rm -rf /tmp/apidiff-main
          git worktree add --detach /tmp/apidiff-main "$base_sha"
          ( cd /tmp/apidiff-main \
            && GOWORK=off apidiff -m -w /tmp/apidiff-main.snapshot github.com/gaborage/go-bricks )

      - name: Build PR-head API snapshot
        id: snapshot_head
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' && steps.baseline.outputs.skip != 'true' }}
        env:
          GOWORK: "off"
        run: GOWORK=off apidiff -m -w /tmp/apidiff-head.snapshot github.com/gaborage/go-bricks

      - name: Diff exported API and enforce escape hatch
        if: >-
          ${{ !cancelled() && steps.snapshot_tag.outcome == 'success'
          && steps.snapshot_base.outcome == 'success' && steps.snapshot_head.outcome == 'success' }}
        env:
          GOWORK: "off"
          BASE_TAG: ${{ steps.baseline.outputs.base_tag }}
          # Pass PR title/labels via env (NOT inline ${{ }} in the script body) so
          # a crafted PR title cannot inject shell — the values are read as data.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # apidiff writes the change list to STDOUT and "Ignoring internal
          # package …" notices to STDERR, so stdout alone is the signal. It
          # exits 0 whether or not changes exist, and non-zero ONLY on a real
          # tool/build error. NO `|| true` on the load-bearing captures below:
          # under `set -e` a tool failure aborts the step, so the gate fails
          # CLOSED instead of silently reporting "no breaks".
          echo "::group::Full apidiff report (base=$BASE_TAG vs PR head)"
          GOWORK=off apidiff -m /tmp/apidiff-base.snapshot /tmp/apidiff-head.snapshot || true
          echo "::endgroup::"

          # Incompatible changes the PR head has vs the release tag, and the set
          # the base branch already has vs the same tag. NO `|| true`: under `set -e`
          # a tool error aborts the step, so the gate fails CLOSED.
          incompat_head="$(GOWORK=off apidiff -incompatible -m \
            /tmp/apidiff-base.snapshot /tmp/apidiff-head.snapshot)"
          incompat_main="$(GOWORK=off apidiff -incompatible -m \
            /tmp/apidiff-base.snapshot /tmp/apidiff-main.snapshot)"

          # Delta = breaks THIS PR introduces = lines in head-set NOT in main-set.
          # `comm -23` requires sorted, de-duplicated, blank-free inputs; the
          # `grep -v '^[[:space:]]*$'` drops blank lines so an empty apidiff
          # capture cannot inject a spurious empty-line "difference". Bash process
          # substitution `<()` — the Ubuntu runner's default shell is bash;
          # a process substitution's own exit status is not propagated to `comm`,
          # so `grep` returning 1 on all-blank input never fails the step.
          delta="$(comm -23 \
            <(printf '%s\n' "$incompat_head" | grep -v '^[[:space:]]*$' | sort -u) \
            <(printf '%s\n' "$incompat_main" | grep -v '^[[:space:]]*$' | sort -u))"

          if [ -z "$delta" ]; then
            echo "✅ No NEW incompatible exported-API changes vs the base branch (delta over breaks it already carries)."
            echo "   (Any breaks vs $BASE_TAG are already acknowledged on the base branch and pending release.)"
            exit 0
          fi

          echo "::warning::NEW incompatible exported-API changes introduced by this PR vs the base branch (delta over already-merged breaks):"
          printf '%s\n' "$delta"

          # ---- Escape hatch (only evaluated when a break exists) ----
          # 1) Conventional-commit '!' marker anchored at the ':' position.
          if printf '%s' "$PR_TITLE" | grep -Eq '^[a-zA-Z]+(\([^)]*\))?!:'; then
            echo "✅ Breaking change ACKNOWLEDGED via '!' in PR title: $PR_TITLE"
            exit 0
          fi

          # 2) 'breaking-approved' label — exact array-element match (not a
          # substring grep, which could match e.g. a 'pre-breaking-approved' label).
          if printf '%s' "$PR_LABELS" | jq -e 'any(.[]?; . == "breaking-approved")' >/dev/null 2>&1; then
            echo "✅ Breaking change ACKNOWLEDGED via 'breaking-approved' label."
            exit 0
          fi

          echo "::error::Incompatible exported-API change shipped without acknowledgement (delta vs the base branch, over already-merged breaks)."
          echo "Retitle the squash PR with a '!' breaking marker (e.g. 'feat!: …' /"
          echo "'fix(scope)!: …') so release-please bumps correctly, or add the"
          echo "'breaking-approved' label if the break is intentional and reviewed."
          exit 1

      - name: Clean up API-snapshot worktrees
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.skip != 'true'
        run: |
          git worktree remove --force /tmp/apidiff-base || true
          git worktree remove --force /tmp/apidiff-main || true

      # verify-mod stays last: `go mod tidy` rewrites go.mod/go.sum in place.
      - name: Verify go mod (Ubuntu only)
        if: ${{ !cancelled() }}
        run: make verify-mod

  # ============================================================================
  # Migration Tool CI Jobs (conditional on tools/migration changes)
  # ============================================================================

  migrate-tool-test:
    permissions:
      contents: read
    needs: changes
    # Gates on `code` (not `migrate_tool`) so the tool's coverage is part of
    # every merged report — otherwise a framework-only change would omit it and
    # SonarCloud would score tools/migration as 0% covered. The tool's other
    # jobs (build, which also runs its lint and vuln steps, and security) stay
    # scoped to `migrate_tool` below.
    if: needs.changes.outputs.code == 'true'
    # The Windows leg is migrate-tool-test-windows below. This one-entry matrix
    # keeps every matrix.os guard in the shared steps resolving.
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults: &migrate-tool-defaults
      run:
        working-directory: tools/migration

    steps: &migrate-tool-test-steps
      - uses: actions/checkout@v7

      - *go-caches-work-disk

      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: tools/migration/go.mod

      # Each leg writes its own OS's entry: the key carries runner.os.
      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: mt-test
          writer: 'true'

      - *go-mod-download

      # Compile only, so the save stores no test result or vet verdict (the
      # writer rule in .github/actions/go-cache). Each mirrors its test step's
      # guard and shell.
      - name: Warm the build cache (Unix, compile only)
        if: steps.gocache.outputs.save == 'true' && matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          go test -c -vet=off -race -o /dev/null ./cmd/... ./internal/...
          go test -c -vet=off -race -cover -covermode=atomic -o /dev/null ./cmd/... ./internal/...

      - name: Warm the build cache (Windows, compile only)
        if: steps.gocache.outputs.save == 'true' && matrix.os == 'windows-latest'
        shell: powershell
        run: |
          go test -c -vet=off -race -o NUL ./cmd/... ./internal/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Go cache
        if: steps.gocache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.primary-key }}

      - name: Run tests (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          packages=$(go list ./cmd/... ./internal/...)
          if [ -z "$packages" ]; then
            echo "No packages found to test"
            exit 1
          fi
          for pkg in $packages; do
            echo "Testing package: $pkg"
            go test -race "$pkg"
          done
          # Coverage failures fail the job — silent absence is what created
          # the SonarCloud-coverage gap this tool fixes.
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "Generating coverage report for SonarCloud"
            go test -race -coverprofile=coverage.out -covermode=atomic $packages
          fi

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $packages = go list ./cmd/... ./internal/...
          if (-not $packages) {
            Write-Host "No packages found to test"
            exit 1
          }
          go test -race $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload coverage artifact for SonarCloud (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: migrate-tool-coverage-report
          path: tools/migration/coverage.out
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # migrate-tool-test's Windows leg, split out like framework-test-windows. The
  # shared defaults matter: without the working directory, go list resolves the
  # framework module and the job goes green testing the wrong code.
  migrate-tool-test-windows:
    permissions:
      contents: read
    name: migrate-tool-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults: *migrate-tool-defaults

    steps: *migrate-tool-test-steps

  migrate-tool-build:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.migrate_tool == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-26.04' || matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 25 }}
    defaults:
      run:
        working-directory: tools/migration

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - *go-caches-work-disk

      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: tools/migration/go.mod

      # The Windows leg writes mt-build's Windows entry; CodeQL's migrate-tool leg
      # writes the Linux one this leg reads.
      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: mt-build
          writer: ${{ runner.os == 'Windows' }}

      - name: Download dependencies
        # Every step below runs in tools/migration, which the go command resolves
        # THROUGH go.work — silently substituting framework HEAD for the
        # `github.com/gaborage/go-bricks` version this module actually pins. That
        # is not what `go install .../cmd/go-bricks-migrate@vX` ships, so without
        # GOWORK=off this job validates a binary no consumer ever gets, and a
        # breaking framework change plus a stale pin merges green. GOWORK=off
        # takes the workspace — and go.work.sum with it — out of the path, so
        # download/build/validate all resolve against tools/migration/go.mod.
        # Same reasoning as lint-framework's GOWORK env, adapted.
        env:
          GOWORK: "off"
        shell: bash
        run: *go-mod-download-retry

      - name: Build and validate CLI (Unix)
        if: matrix.os != 'windows-latest'
        env:
          GOWORK: "off"   # build the pinned graph, not the workspace union
        run: make validate-cli

      - name: Build and validate CLI (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          GOWORK: "off"   # build the pinned graph, not the workspace union
        run: |
          go build -ldflags "-X main.version=dev" -o go-bricks-migrate.exe ./cmd/go-bricks-migrate
          ./go-bricks-migrate.exe version
          ./go-bricks-migrate.exe --help
          Write-Host "CLI validation passed"

      - name: Save Go cache
        if: steps.gocache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.primary-key }}

      # The steps below run on the Linux leg only, keyed on runner.os rather
      # than the matrix label so pinning that label cannot silently skip them.
      # !cancelled() lets lint and vuln still report when the build fails; for
      # a Windows-leg failure that relies on fail-fast: false above, since a
      # fail-fast matrix would cancel this leg and skip them. verify-mod stays
      # last: `go mod tidy` rewrites go.mod/go.sum in place. The golangci-lint
      # steps set no GOWORK, so unlike download/build they lint the workspace
      # union, not the pinned graph.
      #
      # Two platform-scoped passes. golangci-lint analyzes exactly one GOOS —
      # the runner's unless told otherwise — so a single ubuntu run never type-
      # checks a `//go:build windows` file. The tool module has no GOOS-
      # constrained files today; this pass exists so it cannot silently acquire
      # one. Cross-compiled analysis on this Linux leg is cheap enough that it
      # beats running golangci-lint natively on the windows-latest leg
      # (Windows-runner minute multiplier; see lint-framework).
      - name: golangci-lint (migrate tool, linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          working-directory: tools/migration
          args: --timeout=10m
          skip-save-cache: ${{ github.event_name != 'push' }}

      # Reuses the binary the linux pass put on PATH, and its lint cache on disk.
      - name: golangci-lint (migrate tool, windows)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        env:
          GOOS: windows
        with:
          install-mode: none
          working-directory: tools/migration
          args: --timeout=10m
          skip-cache: true

      # The race side of the race/!race pair (#1757; rationale in wiki/linting.md).
      # Delegated to the make target so local and CI run one definition; this module
      # has no race-tagged file, so it skips.
      - name: golangci-lint race pass (migrate tool)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: make lint-race

      - name: Run govulncheck (migrate tool)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: make vuln

      - name: Verify go mod (Ubuntu only)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: make verify-mod

  security-migrate-tool:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.migrate_tool == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/migration

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: tools/migration/go.mod

      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: mt-build

      # security-framework aliases the anchored gosec steps; each job's
      # working directory picks the Makefile. The key hashes the binary rule's
      # recipe, which carries the pinned version, so a bump or an edited rule
      # never reuses a binary; exact key only.
      - &gosec-key
        name: Gosec cache key
        id: gosec-key
        run: |
          set -euo pipefail
          bin="$(echo "gosec-cache-bin: ; @echo \$(GOSEC_BIN)" \
            | make -s --no-print-directory -f Makefile -f - gosec-cache-bin)"
          if [ -z "$bin" ]; then
            echo "::error::gosec cache: the Makefile sets no GOSEC_BIN"
            exit 1
          fi
          recipe="$(make -s -n -B "$bin" | sha256sum | cut -d' ' -f1)"
          gover="$(go env GOVERSION)"
          {
            echo "bin=$bin"
            echo "key=gosec-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-none}-${gover}-${recipe}"
          } >> "$GITHUB_OUTPUT"

      - &gosec-restore
        name: Restore gosec
        id: gosec-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.gosec-key.outputs.bin }}
          key: ${{ steps.gosec-key.outputs.key }}

      # The binary's rule has no prerequisites, so make would trust a partial
      # file a failed restore left behind.
      - &gosec-drop-partial
        name: Drop a partial gosec restore
        if: steps.gosec-restore.outputs.cache-hit != 'true'
        env:
          GOSEC_PATH: ${{ steps.gosec-key.outputs.bin }}
        run: rm -f "$GOSEC_PATH"

      # Only the fetch retries; make sec runs once. A restored binary leaves
      # install-gosec nothing to do.
      - &gosec-install
        name: Install gosec
        run: |
          for delay in 15 30; do
            make install-gosec && exit 0
            echo "::warning title=network retry::gosec install failed; retrying in ${delay}s"
            sleep "$delay"
          done
          make install-gosec

      - name: Run gosec (migrate tool)
        run: make sec

      # After the scan, so the saved binary has run.
      - &gosec-save
        name: Save gosec
        if: github.event_name == 'push' && steps.gosec-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gosec-key.outputs.bin }}
          key: ${{ steps.gosec-key.outputs.key }}

  # ============================================================================
  # Shared Jobs (run for framework OR tool OR both)
  # ============================================================================

  lint-framework:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: go.mod

      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: fw-light
          writer: 'true'

      # Two platform-scoped passes, distinctly named so a failure says which GOOS
      # produced it. golangci-lint analyzes exactly one GOOS — the runner's
      # unless told otherwise — so an ubuntu-only run never type-checks a file
      # behind `//go:build windows`. That left migration/proc_windows.go, live
      # production code, unlinted since it was written, while its
      # `//go:build !windows` siblings were covered. Cross-compiling the analysis
      # closes the same hole as a windows-latest matrix leg without paying the
      # Windows-runner minute multiplier or adding a leg to ci-ok's needs graph.
      - name: golangci-lint (framework, linux)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        env:
          # Scope the run to the root (framework) module. `--skip-dirs=tools` was
          # a golangci-lint v1 flag (deprecated in v2). `./...` already stops at
          # the tools/migration module boundary, but golangci-lint's v2 workspace
          # mode would otherwise pull that unioned module in; GOWORK=off disables
          # the workspace so the separately-versioned submodule (covered by
          # migrate-tool-build) can't leak into framework findings, and lint
          # resolves against the framework's own go.mod — the dependency view its
          # consumers actually see.
          GOWORK: "off"
        with:
          version: v2.14.0
          args: --timeout=10m
          skip-save-cache: ${{ github.event_name != 'push' }}

      # Reuses the binary the linux pass put on PATH, and its lint cache on disk.
      - name: golangci-lint (framework, windows)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        env:
          GOWORK: "off"
          GOOS: windows
        with:
          install-mode: none
          args: --timeout=10m
          skip-cache: true

      # internal/racedetect/race.go is read by this pass and no other (#1757).
      - name: golangci-lint race pass (framework)
        run: make lint-race

      # Keeps the tag set a closed class: fails when a //go:build tag appears that
      # no lint or security pass reads, so the next tag cannot arrive unnoticed.
      - name: Build-tag allowlist guard
        run: make check-tags

      # golangci-lint runs its analyzers in process and this job runs no
      # go test or go vet, so the entry holds build output and modules only.
      - name: Save Go cache
        if: steps.gocache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.primary-key }}

  security-framework:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: go.mod

      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: fw-light

      - *gosec-key

      - *gosec-restore

      - *gosec-drop-partial

      - *gosec-install

      - name: Run gosec (framework)
        run: make sec

      - *gosec-save

  vuln-weekly:
    permissions:
      contents: read
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: go.mod
      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: fw-light
      - name: Run govulncheck (both modules)
        run: |
          set +e
          make vuln; fw=$?
          make -C tools/migration vuln; cli=$?
          if [ "$fw" -ne 0 ] || [ "$cli" -ne 0 ]; then
            echo "::error::govulncheck found vulnerabilities (framework exit=$fw, migrate-tool exit=$cli)"
            exit 1
          fi

  # ============================================================================
  # Documentation Jobs (conditional on Markdown changes)
  # ============================================================================

  lint-docs:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The docs filter lists this file, so this runs on every edit of it.
      # Schedule-only jobs belong in the grep -vxE exclusion.
      - name: Assert every job except ci-ok and vuln-weekly is a ci-ok need
        run: |
          set -euo pipefail
          export LC_ALL=C
          wf=.github/workflows/ci-v2.yml
          jobs=$(yq '.jobs | keys | .[]' "$wf" \
            | { grep -vxE 'ci-ok|vuln-weekly' || [ $? -eq 1 ]; } | sort)
          [ -n "$jobs" ] || { echo "::error::could not read the job ids"; exit 1; }
          needs=$(yq '.jobs["ci-ok"].needs[]' "$wf" | sort)
          [ -n "$needs" ] || { echo "::error::could not read ci-ok needs"; exit 1; }
          missing=$(comm -23 <(printf '%s\n' "$jobs") <(printf '%s\n' "$needs"))
          [ -z "$missing" ] || { echo "::error::jobs missing from ci-ok needs: $(printf '%s\n' "$missing" | paste -sd' ' -)"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: markdownlint-cli2 (docs)
        # Delegates to `make lint-md` so the command, the pinned
        # MARKDOWNLINT_VERSION, and the glob/ignore set live in exactly one place
        # — the same single-source-of-truth rule the `make test-alloc`,
        # `make sec`, and `make vuln` steps follow. Deliberately NOT the
        # markdownlint-cli2 GitHub Action: that action bundles its own linter
        # build, so pinning the action would pin a version this repo cannot run
        # locally, and `make lint-md` and CI could drift. setup-node pins the
        # Node floor (markdownlint-cli2 0.23+ requires Node >= 22); npx
        # resolves the pinned package against it.
        run: make lint-md

  # ============================================================================
  # Release PR gate (#1565): llms.txt declares the version being released
  # ----------------------------------------------------------------------------
  # Runs ONLY on the release-please PR (head branch `release-please--…`) and
  # skips on every other PR, which ci-ok tolerates. It requires llms.txt's
  # Version & Compatibility bullet to declare the manifest's version and carry a
  # ladder clause for it (rules in the script header). A pull_request run checks
  # out the PR merged with main, so the job reads main's llms.txt: the docs(llms)
  # PR lands first, release-please rebuilds its branch, and the job goes green
  # (RELEASING.md §1). head_ref appears only in the `if:` expression, never in a
  # shell step.
  # ============================================================================
  llms-version:
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: llms.txt declares the release-please manifest's version
        run: scripts/check-llms-version.sh

  # ============================================================================
  # SonarCloud (framework + tool coverage)
  # ============================================================================

  sonarcloud:
    permissions:
      contents: read
    name: SonarCloud
    # framework-test-windows and migrate-tool-test-windows are deliberately
    # absent: they upload no coverage, so the scan does not wait on them.
    # ci-ok needs them directly, and that is what enforces them.
    needs: [changes, framework-test, framework-integration-test, migrate-tool-test]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.framework-test.result == 'success' || needs.framework-test.result == 'skipped') &&
      (needs.framework-integration-test.result == 'success' || needs.framework-integration-test.result == 'skipped') &&
      (needs.migrate-tool-test.result == 'success' || needs.migrate-tool-test.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # No concurrency group here: a cancelled scan fails ci-ok, so nothing may
    # cancel one. The workflow-level group already leaves one live run per PR,
    # and scans of overlapping main pushes may run side by side (the scan only
    # uploads; it does not wait for the quality gate).

    steps:
      # Checkout first: its clean deletes anything downloaded before it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # All three coverage jobs gate on `code`, so on any non-doc change they
      # all ran and uploaded their artifacts. Download them unconditionally — a
      # missing artifact fails its download step. The producers keep them 7
      # days, so re-running this job alone finds them. They unpack under
      # runner.temp and only the three profiles are copied into the checkout:
      # this job holds SONAR_TOKEN, so no other file an artifact carries may
      # land in the tree the merge and the scan run from. Each download retries
      # once for a transient artifact-service error.
      - name: Download unit test coverage
        id: dl_unit
        continue-on-error: true
        uses: actions/download-artifact@v8
        with: &dl-unit
          name: coverage-unit
          path: ${{ runner.temp }}/cov/unit

      - name: Download unit test coverage (retry)
        id: dl_unit_retry
        if: steps.dl_unit.outcome == 'failure'
        uses: actions/download-artifact@v8
        with: *dl-unit

      - name: Download integration test coverage
        id: dl_integration
        continue-on-error: true
        uses: actions/download-artifact@v8
        with: &dl-integration
          name: coverage-integration
          path: ${{ runner.temp }}/cov/integration

      - name: Download integration test coverage (retry)
        id: dl_integration_retry
        if: steps.dl_integration.outcome == 'failure'
        uses: actions/download-artifact@v8
        with: *dl-integration

      - name: Download migrate tool coverage
        id: dl_migrate
        continue-on-error: true
        uses: actions/download-artifact@v8
        with: &dl-migrate
          name: migrate-tool-coverage-report
          path: ${{ runner.temp }}/cov/migrate

      - name: Download migrate tool coverage (retry)
        id: dl_migrate_retry
        if: steps.dl_migrate.outcome == 'failure'
        uses: actions/download-artifact@v8
        with: *dl-migrate

      # A failed retry fails the job itself; without this, a renamed id skips the
      # retry and leaves a failed download green.
      - name: Assert every coverage download passed
        env:
          UNIT: ${{ steps.dl_unit.outcome }}
          UNIT_RETRY: ${{ steps.dl_unit_retry.outcome }}
          INTEGRATION: ${{ steps.dl_integration.outcome }}
          INTEGRATION_RETRY: ${{ steps.dl_integration_retry.outcome }}
          MIGRATE: ${{ steps.dl_migrate.outcome }}
          MIGRATE_RETRY: ${{ steps.dl_migrate_retry.outcome }}
        run: |
          set -euo pipefail
          # $1 names the download, $2 and $3 are its two attempts' outcomes.
          passed() {
            [ "$2" = success ] && return 0
            if [ "$3" = success ]; then
              echo "::warning title=network retry::$1 download failed once; the retry passed"
              return 0
            fi
            echo "::error::$1 download: no attempt passed (first: ${2:-none}, retry: ${3:-none})"
            return 1
          }
          passed coverage-unit "$UNIT" "$UNIT_RETRY"
          passed coverage-integration "$INTEGRATION" "$INTEGRATION_RETRY"
          passed migrate-tool-coverage-report "$MIGRATE" "$MIGRATE_RETRY"

      - name: Stage coverage profiles
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/cov/unit/coverage.out" coverage.out
          cp "$RUNNER_TEMP/cov/integration/coverage-integration.out" coverage-integration.out
          cp "$RUNNER_TEMP/cov/migrate/coverage.out" tools/migration/coverage.out
          for f in coverage.out coverage-integration.out tools/migration/coverage.out; do
            test -s "$f" || { echo "::error::downloaded coverage profile $f is empty"; exit 1; }
          done

      - name: Merge coverage files
        run: |
          set -euo pipefail

          echo "=== Coverage Merge Process ==="
          echo "Checking for available coverage files..."

          # Check which coverage files exist
          has_framework_unit=false
          has_framework_integration=false
          has_migrate_tool=false

          if [ -f coverage.out ]; then
            echo "✓ Framework unit tests coverage found"
            has_framework_unit=true
          fi

          if [ -f coverage-integration.out ]; then
            echo "✓ Framework integration tests coverage found"
            has_framework_integration=true
          fi

          if [ -f tools/migration/coverage.out ]; then
            echo "✓ Migrate tool coverage found"
            has_migrate_tool=true
          fi

          # Defense-in-depth: the report uploaded to SonarCloud must be COMPLETE.
          # This job only runs on non-doc (`code`) changes, where framework-test,
          # framework-integration-test, and migrate-tool-test all run and upload
          # their coverage. If any part is missing here, a partial report would
          # mis-score the absent module as 0% covered — the failure mode that
          # collapsed framework coverage from ~90% to ~4% on tools-only pushes.
          # Fail loudly rather than upload an incomplete report.
          missing=""
          [ "$has_framework_unit" = true ]        || missing="$missing framework-unit(coverage.out)"
          [ "$has_framework_integration" = true ] || missing="$missing framework-integration(coverage-integration.out)"
          [ "$has_migrate_tool" = true ]          || missing="$missing migrate-tool(tools/migration/coverage.out)"
          if [ -n "$missing" ]; then
            echo "❌ ERROR: coverage report is incomplete — missing:$missing"
            echo "    Refusing to upload a partial coverage report to SonarCloud."
            echo "    Each coverage producer must have run and uploaded its artifact."
            exit 1
          fi

          echo ""
          echo "=== Coverage File Validation ==="

          # Validate framework unit coverage
          if [ "$has_framework_unit" = true ]; then
            unit_lines=$(wc -l < coverage.out)
            echo "Framework unit coverage: $unit_lines lines"

            # The producer deduped it, so each line past the mode line is a distinct
            # block of the -coverpkg=./... set (~18.7k today) however few tests ran;
            # under 10k means that set collapsed or the profile is near-empty.
            if [ "$unit_lines" -lt 10000 ]; then
              echo "⚠️  WARNING: Framework unit coverage is unusually small ($unit_lines lines)"
              echo "    Expected: >10,000 lines for full framework coverage"
            fi

            # Check first non-mode line to verify it's framework code (not tool code)
            first_package=$(sed -n '2p' coverage.out | cut -d':' -f1)
            if echo "$first_package" | grep -q "tools/"; then
              echo "❌ ERROR: Framework coverage file contains tool packages!"
              echo "    First package: $first_package"
              echo "    This indicates artifact download overwrote framework coverage"
              exit 1
            else
              echo "✓ Framework coverage verified (starts with: $first_package)"
            fi
          fi

          # Validate integration coverage (deduped by its producer too: ~19.1k
          # distinct blocks today; under 1000 means the -coverpkg=./... set
          # collapsed or the profile is near-empty, not that tests went missing)
          if [ "$has_framework_integration" = true ]; then
            integration_lines=$(wc -l < coverage-integration.out)
            echo "Integration coverage: $integration_lines lines"

            if [ "$integration_lines" -lt 1000 ]; then
              echo "⚠️  WARNING: Integration coverage is small ($integration_lines lines)"
            else
              echo "✓ Integration coverage looks reasonable"
            fi
          fi

          # Merge coverage files: concatenate, then collapse shared blocks
          # This approach is optimal for our use case because:
          # - Overlap is expected: every unit block reappears in the integration
          #   profile, and cover-dedup.awk sums them (each producer already
          #   collapsed its own per-test-binary copies); migrate tool blocks are disjoint
          # - All files from same source code (same Go version, same build)
          # - All use covermode=atomic consistently
          # - Zero external dependencies (tools like gocovmerge would add unnecessary complexity)
          echo ""
          echo "Merging coverage files..."

          # Start with framework unit coverage if available, otherwise create empty file with mode line
          if [ "$has_framework_unit" = true ]; then
            cat coverage.out > coverage-merged.out
          else
            echo "mode: atomic" > coverage-merged.out
          fi

          # Append framework integration coverage (skip mode line)
          if [ "$has_framework_integration" = true ]; then
            tail -n +2 coverage-integration.out >> coverage-merged.out
          fi

          # Append migrate tool coverage (skip mode line)
          if [ "$has_migrate_tool" = true ]; then
            tail -n +2 tools/migration/coverage.out >> coverage-merged.out
          fi

          # Two plain commands, so errexit sees awk's status. The script is checked
          # against go test's own profile in the producers, where the raw copy exists.
          awk -f scripts/cover-dedup.awk coverage-merged.out > coverage-merged.out.dedup
          mv coverage-merged.out.dedup coverage-merged.out

          # Show summary
          echo ""
          echo "=== Coverage Merge Summary ==="
          if [ "$has_framework_unit" = true ]; then
            wc -l coverage.out | awk '{print "Framework unit:       " $1 " lines"}'
          fi
          if [ "$has_framework_integration" = true ]; then
            wc -l coverage-integration.out | awk '{print "Framework integration:" $1 " lines"}'
          fi
          if [ "$has_migrate_tool" = true ]; then
            wc -l tools/migration/coverage.out | awk '{print "Migrate tool coverage:" $1 " lines"}'
          fi
          wc -l coverage-merged.out | awk '{print "Merged total:         " $1 " lines"}'

          # Rename merged file to coverage.out for SonarCloud
          mv coverage-merged.out coverage.out

          echo ""
          echo "✓ Coverage merge complete - ready for SonarCloud"

      # One retry for a SonarCloud 5xx or a scanner-download error. The scan only
      # uploads (no quality-gate wait), so a retry cannot change a verdict.
      - name: Scan
        id: scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env: &sonar-env
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Scan (retry)
        id: scan_retry
        if: steps.scan.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env: *sonar-env

      # As with the downloads: without this, a renamed id leaves a failed scan green.
      - name: Assert a scan attempt passed
        env:
          SCAN: ${{ steps.scan.outcome }}
          SCAN_RETRY: ${{ steps.scan_retry.outcome }}
        run: |
          [ "$SCAN" = success ] && exit 0
          if [ "$SCAN_RETRY" = success ]; then
            echo "::warning title=network retry::the SonarCloud scan failed once; the retry passed"
            exit 0
          fi
          echo "::error::no SonarCloud scan attempt passed (first: ${SCAN:-none}, retry: ${SCAN_RETRY:-none})"
          exit 1

  # ============================================================================
  # CI gate (fan-in aggregator — the single required status check on main)
  # ----------------------------------------------------------------------------
  # Branch protection requires only THIS check. It depends on every PR-relevant
  # leaf job and fails if any of them failed or was cancelled. 'skipped' counts
  # as success so doc-only PRs (where the Go jobs skip) and code-only PRs (where
  # lint-docs skips) both still pass — the same always()+skipped-tolerant idiom
  # used by sonarcloud above. That tolerance is safe in BOTH directions because
  # every job in this `needs:` list is gated either on `changes` outputs alone,
  # on the event and head branch alone (llms-version, which needs no other job),
  # or on another job that is ALSO in this list — so a failure always surfaces
  # under its own key even when it makes a downstream job skip. (It is NOT true
  # that a job only skips when its own filter said "not my paths": sonarcloud
  # skips when an upstream job fails. Its tolerance is safe purely because those
  # upstreams are listed here too.) Never add a job here whose `needs:`
  # reference a job that is not — that job's failure would reach this gate only
  # as a tolerated 'skipped'.
  # vuln-weekly is schedule-only and intentionally absent.
  # When you add a new PR job, add it to `needs:` here or it stays unenforced;
  # lint-docs fails the PR when one is missing (a new schedule-only job goes in
  # that guard's exclusion instead).
  # A cancelled need must FAIL this gate — never gate it on !cancelled(): a
  # skipped ci-ok counts as passing, and the red ci-ok of a run cancelled by the
  # workflow-level group is what holds a twin's shared commit closed until the
  # live run's ci-ok supersedes it.
  # ============================================================================
  ci-ok:
    permissions:
      contents: read
    name: ci-ok
    if: always() && github.event_name != 'schedule'
    needs:
      - changes
      - framework-test
      - framework-test-windows
      - framework-integration-test
      - framework-build
      - migrate-tool-test
      - migrate-tool-test-windows
      - migrate-tool-build
      - security-migrate-tool
      - lint-framework
      - security-framework
      - lint-docs
      - llms-version
      - sonarcloud
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "Aggregated job results:"
          printf '%s\n' "$NEEDS_JSON"
          # lint-docs runs the needs guard; once lint-docs is dropped from these needs, its red no longer reaches this gate.
          printf '%s' "$NEEDS_JSON" | jq -e 'has("lint-docs")' >/dev/null \
            || { echo "::error::lint-docs (it runs the ci-ok needs guard) is missing from ci-ok needs"; exit 1; }
          # Fail only on 'failure'/'cancelled'. 'success' and 'skipped' pass —
          # path-filtered jobs legitimately skip on doc-only PRs.
          failed="$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries[]
                     | select(.value.result == "failure" or .value.result == "cancelled")
                     | .key')"
          if [ -n "$failed" ]; then
            echo "::error::Required job(s) did not pass:"
            printf '  - %s\n' $failed
            # PR runs only: push runs key the group on run_id, so nothing supersedes them.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && printf '%s' "$NEEDS_JSON" \
                | jq -e 'all(.[]; .result != "failure")' >/dev/null; then
              echo "::notice::ci-ok failed only on cancelled jobs (a newer run of this PR, a manual cancel, or a timeout). If the newest ci-ok on this commit is green, leave this run alone: re-running it cancels the live run. If it is red or missing, re-run the newest run."
            fi
            exit 1
          fi
          echo "✅ All required jobs passed (or were skipped on a doc-only PR)."
