name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/codeql.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/codeql.yml'
      - '.github/actions/**'
  schedule:
    - cron: '26 23 * * 3'   # Wednesdays 23:26 UTC — weekly re-scan of main

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One leg per Go module. `go.work` scopes a build to the module it runs in,
  # so a single root build would silently leave tools/migration unanalyzed.
  # Each leg uploads under its own `category`, which is what keeps two
  # same-language SARIF uploads from overwriting one another.
  analyze:
    name: Analyze Go (${{ matrix.module }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      security-events: write   # upload SARIF results
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: framework
            directory: .
            go-version-file: go.mod
            cache-family: fw-build
            cache-writer: 'false'
            category: /language:go/module:framework
          - module: migrate-tool
            directory: tools/migration
            go-version-file: tools/migration/go.mod
            # This leg writes mt-build's Linux entry.
            cache-family: mt-build
            cache-writer: 'true'
            category: /language:go/module:migrate-tool

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pin the toolchain to the module's go.mod so extraction uses the Go
      # version CI builds with, not the runner's preinstalled default.
      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          go-version-file: ${{ matrix.go-version-file }}

      - name: Restore Go cache
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          family: ${{ matrix.cache-family }}
          writer: ${{ matrix.cache-writer }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          queries: security-extended

      # Manual rather than autobuild: autobuild always builds from the repo
      # root, which cannot reach the second module. GOWORK=off matches how
      # ci-v2.yml builds tools/migration — the workspace would otherwise pull
      # in the local framework copy instead of the version its go.mod pins.
      - name: Build ${{ matrix.module }}
        working-directory: ${{ matrix.directory }}
        env:
          GOWORK: 'off'
        run: go build ./...

      # The save follows the build, before the analysis; this job runs no go
      # test or go vet.
      - name: Save Go cache
        if: steps.gocache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: ${{ steps.gocache.outputs.primary-key }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: ${{ matrix.category }}
