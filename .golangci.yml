version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose                 # checks whether HTTP response body is closed successfully
    - copyloopvar               # checks for unnecessary loop-variable copies (Go 1.22+ per-iteration vars)
    - dogsled                   # checks assignments with too many blank identifiers
    - dupl                      # code clone detection
    - durationcheck             # checks for two durations multiplied together
    - errcheck                  # checks for unchecked errors
    - errname                   # checks that error variables/types follow the errFoo/FooError convention
    - errorlint                 # finds code that may cause problems with the Go 1.13 error wrapping scheme
    - exhaustive                # checks exhaustiveness of enum switch statements
    - forbidigo                 # forbids identifiers by pattern (here: raw span-error recording, ADR-083)
    - forcetypeassert           # finds unchecked type assertions (uber-go: Handle Type Assertion Failures)
    - gocheckcompilerdirectives # validates go compiler directive comments (//go:)
    - gochecknoinits            # checks that no init functions are present
    - goconst                   # finds repeated strings that could be replaced by a constant
    - gocritic                  # provides diagnostics that check for bugs, performance and style issues
    - gocyclo                   # computes and checks the cyclomatic complexity of functions
    - goprintffuncname          # checks that printf-like functions are named with f at the end
    - gosec                     # inspects source code for security problems
    - govet                     # reports suspicious constructs (go vet)
    - importas                  # enforces one alias per import path (uber-go: Import Aliasing)
    - ineffassign               # detects when assignments to existing variables are not used
    - lll                       # reports long lines
    - loggercheck               # checks key-value pairs for common logger libraries (zap, zerolog, ...)
    - makezero                  # finds slice declarations with non-zero initial length used with append
    - misspell                  # finds commonly misspelled English words in comments
    - musttag                   # enforces field tags in (un)marshaled structs
    - nakedret                  # finds naked returns in functions greater than a specified function length
    - nestif                    # reports deeply nested if statements (uber-go: Reduce Nesting)
    - nilerr                    # finds code that returns nil even if it checks that the error is not nil
    - noctx                     # finds sending HTTP request without context.Context
    - nolintlint                # reports ill-formed or insufficient nolint directives
    - perfsprint                # fmt.Sprintf calls with faster strconv/concat equivalents (uber-go: Prefer strconv over fmt)
    - prealloc                  # finds slice declarations that could potentially be preallocated
    - recvcheck                 # flags types mixing pointer and value receivers (uber-go: Receivers and Interfaces)
    - revive                    # fast, configurable, extensible, flexible, and beautiful linter for Go
    - rowserrcheck              # checks whether Err of rows is checked successfully
    - spancheck                 # checks for mistakes with OpenTelemetry/Census spans
    - sqlclosecheck             # checks that sql.Rows and sql.Stmt are closed
    - staticcheck               # staticcheck is a go vet on steroids, applying a ton of static analysis checks
    - testifylint               # checks usage of testify assertions
    - unconvert                 # removes unnecessary type conversions
    - unparam                   # reports unused function parameters
    - usestdlibvars             # prefers stdlib constants (http.MethodGet) over string literals
    - wastedassign              # finds wasted assignment statements
    - whitespace                # detection of leading and trailing whitespace
    - zerologlint               # detects the wrong usage of zerolog that a user forgets to dispatch with Send or Msg
  settings:
    dupl:
      threshold: 100
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      # analyze-types is load-bearing, not a precaution: it rewrites the source
      # to `<package>.<type>.<method>` before matching, so the first pattern
      # resolves the interface method and an unrelated third-party RecordError
      # expands to its own type and cannot match. Without it the match text is
      # the literal `span.RecordError`, which fires on any variable named span
      # and misses one named s. The semconv pattern keys off the package NAME to
      # dodge the versioned-import-path staleness the importas note below flags.
      # It costs nothing here: golangci-lint pins forbidigo to LoadModeTypesInfo
      # regardless of this setting, and govet/staticcheck/gosec already put the
      # shared loader there. spancheck's record-error/set-status checks stay off:
      # enabling them would demand the very RecordError call this forbids.
      analyze-types: true
      forbid:
        - pattern: ^trace\.Span\.RecordError$
          msg: record span errors by type through observability.RecordErrorByType (ADR-083) — RecordError writes the error's message into the span.
        - pattern: ^semconv\.Exception.*$
          msg: build the exception event through observability.RecordErrorByType (ADR-083) rather than assembling semconv exception attributes by hand.
    goconst:
      min-len: 4
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow  # reports shadowed variables (disabled by default)
    importas:
      # Conflict-only map: every entry below is an import path the tree already
      # aliases two or more different ways, pinned to the alias the majority of
      # call sites already use. Packages with a single consistent alias are left
      # out on purpose — listing them would add no findings today and only risk
      # a version-stamped path (go.opentelemetry.io/otel/semconv/v1.NN.0) going
      # stale and silently matching nothing after the next bump.
      #
      # `no-unaliased` and `no-extra-aliases` stay OFF: either one turns this
      # 11-site cleanup into a ~40-file sweep over imports that read fine.
      #
      # net/http is deliberately absent — 56 unaliased sites against 7 nethttp
      # and 6 stdhttp is not a convention to ratchet, it is a decision nobody
      # has made yet.
      alias:
        - pkg: github.com/gaborage/go-bricks/database/testing
          alias: dbtesting
        - pkg: github.com/gaborage/go-bricks/jose/testing
          alias: jositest
        - pkg: github.com/go-jose/go-jose/v4
          alias: jose
        - pkg: github.com/rabbitmq/amqp091-go
          alias: amqp
        # metricznoop (3 sites) outnumbered metricnoop (2) and otelnoop (2), but
        # it is a typo — the extra findings buy its deletion.
        - pkg: go.opentelemetry.io/otel/metric/noop
          alias: metricnoop
    lll:
      line-length: 215
    misspell:
      locale: US
    nolintlint:
      # A directive must say which linter it silences and why. With #1092's
      # exceptions file gone, the reason on the line IS the record, and
      # allow-unused only proves a directive still fires — never that it explains
      # itself. All three together make the convention self-enforcing.
      require-explanation: true
      require-specific: true
      allow-unused: false
    perfsprint:
      # Rewriting fmt.Sprintf into string concatenation is a speedup the uber-go
      # guide does not ask for ("Prefer strconv over fmt" covers integer
      # conversion only), and it costs readability in message-building code.
      string-format: false
    revive:
      confidence: 0
      # Declaring `rules` REPLACES revive's default set rather than extending it.
      # `enable-default-rules` restores the defaults, so only the additions need
      # listing. This is behavior-identical to re-declaring the 23 default names:
      # golangci-lint's own default list is a verbatim copy of revive's, and both
      # spellings resolve to the same 40-rule set. An unknown rule name only logs
      # `level=error` and still exits 0, so a typo below silently disables a rule —
      # keep names exact.
      enable-default-rules: true
      rules:
        # Additions from the uber-go style guide. Each measured 0 findings
        # against the tree, so they ratchet current behavior without a sweep.
        - name: atomic                  # non-atomic assignment to an atomic value
        - name: bare-return             # "Avoid Naked Returns"
        - name: confusing-results       # unnamed same-type multi-returns
        - name: deep-exit               # "Exit in Main": os.Exit/log.Fatal outside main/init
        - name: early-return            # "Reduce Nesting"
        - name: defer                   # defer in loop, recover, return-in-defer
        - name: identical-branches      # if/else with identical bodies
        - name: max-control-nesting     # "Reduce Nesting"
        - name: modifies-value-receiver # mutation lost on a value receiver
        - name: optimize-operands-order
        - name: range-val-address       # address of a range value
        - name: string-of-int           # string(intValue) conversions
        - name: unconditional-recursion
        - name: unnecessary-stmt
        - name: use-any                 # interface{} -> any
        - name: useless-break
        - name: waitgroup-by-value      # "Zero-value Mutexes are Valid"
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    testifylint:
      enable-all: true
      # Default, written out because it is the load-bearing half of go-require:
      # false keeps the checker looking inside http.HandlerFunc bodies, where a
      # require call aborts the server goroutine instead of the test. Sixty test
      # files here spawn a goroutine or an httptest server, so this is the guard
      # that makes go-require worth enabling.
      go-require:
        ignore-http-handlers: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - forcetypeassert
          - goconst
          - gocyclo
          - gosec
          - ineffassign
          - rowserrcheck
        path: _test\.go
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - staticcheck
        text: 'SA9003:'
      # zerologlint cannot follow the LogEventAdapter wrapper which dispatches via its own Send/Msg
      - linters:
          - zerologlint
        path: logger/adapter\.go
      # cmd/seal-payload is the only file set that imports BOTH go-jose/v4 (whose
      # package name is `jose`) and github.com/gaborage/go-bricks/jose. One of
      # them must be aliased away, and the go-bricks package is the dominant one
      # here — so the vendor import keeps `gojose`, which is exactly the
      # collision-avoidance case uber-go's "Import Aliasing" prescribes. The
      # importas entry still holds everywhere else.
      # Deliberately unanchored: golangci's shared result cache can replay this
      # finding under a prefixed path (e.g. ../<worktree>/cmd/seal-payload/...),
      # which a ^-anchor fails to match — defense in depth behind per-tree lint
      # caches. No other cmd/seal-payload path exists, so the wider match is safe.
      - linters:
          - importas
        path: cmd/seal-payload/
        text: 'go-jose/go-jose/v4'
    paths:
      - third_party$
      - builtin$
# Formatters are a separate top-level block in golangci-lint v2 — listing gofumpt
# or gci under `linters.enable` is a hard config error ("can't load config:
# gofumpt is a formatter"). `golangci-lint run` still reports their output as
# ordinary issues ("File is not properly formatted (gci)"), so `make fmt` must
# invoke `golangci-lint fmt`; `go fmt` cannot fix either of these.
formatters:
  enable:
    - gci     # uber-go: "Import Grouping"
    - gofumpt # uber-go: "Group Similar Declarations" and the rest of gofmt's stricter superset
  settings:
    gci:
      # Section ORDER is the decision here, and it is deliberate. gci's natural
      # order already puts `default` (third party) ahead of a `prefix` group,
      # which is how most of this tree was written by hand. Measured against the
      # pre-adoption tree at v2.12.2:
      #   standard, default, prefix(go-bricks)  ->  70 files / 290 lines
      #   standard, default (no prefix section) -> 138 files / 589 lines
      #   standard, prefix(go-bricks), default  -> 199 files / 806 lines
      #     (that third one needs custom-order: true; without it gci normalises
      #      the sections straight back to the first order)
      # Dropping the prefix section is not merely 2x the churn: re-running the
      # no-prefix order against the formatted tree rewrites 197 files, MERGING
      # third-party imports back into the go-bricks block in every one. Do not
      # "simplify" this by removing the prefix section or hoisting it above
      # default.
      sections:
        - standard
        - default
        - prefix(github.com/gaborage/go-bricks)
    gofumpt:
      # extra-rules was measured (+24 lines over the base rules) and rejected: it
      # implements no rule the uber-go guide asks for.
      extra-rules: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
